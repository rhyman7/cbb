name: Rebuild college basketball data

# hoopR's men's college files update through the night after games; the slate's lines move all day.
# Runs at about 3 AM, 10 AM, 2 PM and 6 PM New York time (UTC times below, standard time).
on:
  schedule:
    - cron: "27 8 * 11,12,1-4 *"
    - cron: "27 15 * 11,12,1-4 *"
    - cron: "27 19 * 11,12,1-4 *"
    - cron: "27 23 * 11,12,1-4 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rebuild-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build data.json
        run: python scripts/build_data.py

      - name: Check the build
        run: python scripts/check_data.py

      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Data update ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
